name: Release binaries

# Runs after release-plz publishes a GitHub release. Builds the binary for
# each target and attaches the archives to the release. Archive names follow
# the `$bin-$target` layout that `cargo binstall` resolves by default, so no
# custom `pkg-url` is needed in Cargo.toml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload-assets:
    name: Upload ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: github.repository_owner == 'ranger-ross'
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cargo-storage
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
