name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  # Release unpublished packages: publishes to crates.io and creates
  # the git tag plus GitHub release. Binary assets are attached by
  # the `release.yml` workflow once the release is published.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ranger-ross'
    # OIDC subject becomes repo:...:environment:release, so the crates.io
    # trusted publisher entry must set Environment to `release` too.
    environment: release
    permissions:
      contents: write
      pull-requests: read
      # Needed for crates.io trusted publishing (no API token required).
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # PAT (not GITHUB_TOKEN): pushes made with GITHUB_TOKEN do not
      # trigger other workflows, so release.yml would never run.
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ranger-ross'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
