name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: "*"

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.1

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.nightly }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["stable", "beta"]
        nightly: [false]
        include:
          - os: ubuntu-latest
            toolchain: "nightly"
            nightly: true
          - os: macos-latest
            toolchain: "nightly"
            nightly: true
          - os: windows-latest
            toolchain: "nightly"
            nightly: true

    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.nightly }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["stable", "beta"]
        nightly: [false]
        include:
          - os: ubuntu-latest
            toolchain: "nightly"
            nightly: true
          - os: macos-latest
            toolchain: "nightly"
            nightly: true
          - os: windows-latest
            toolchain: "nightly"
            nightly: true

    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Run tests
        run: cargo nextest run --all-features --all-targets
