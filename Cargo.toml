[package]
name = "cargo-storage"
description = "Cargo storage management CLI/TUI"
version = "0.4.1"
edition = "2024"
authors = ["Ross Sullivan <rosssullivan101@gmail.com>"]
repository = "https://github.com/ranger-ross/cargo-storage.git"
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
readme = "README.md"
license = "MIT"
exclude = [".github/", "renovate.json", ".gitignore", "assets"]
[package.metadata.binstall]
# Archives ship the binary at the archive root (no leading dir).
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
eyre = "0.6"
timeago = { version = "0.6", default-features = false }
bytefmt = "0.1"
regex = "1"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = "0.3"
ignore = "0.4.33"
rayon = "1.12.0"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
figment = { version = "0.10", features = ["toml", "env"] }
homedir = "0.3.6"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
mdquery-rs = "0.2.1"
